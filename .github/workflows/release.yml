name: Release

# Builds a signed APK on every push to main and attaches it to a **draft** release, so
# publishing stays a deliberate act rather than a side effect of merging.
#
# This is the only workflow that touches the signing key, and it is reachable only by
# pushing to main — which requires write access to this repository. Pull requests, forks
# and dev pushes never run it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create the draft release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Forks get their own repository name, so a fork cannot run this even if it somehow
    # had the secrets.
    if: github.repository == 'Bentlybro/kern'

    # The signing secrets live in this environment, not at repository level.
    #
    # This is the defence against the leak that pinning and triggers do not cover: a
    # change to a workflow file that starts using the secrets. Repository secrets are
    # readable by any workflow that asks; environment secrets are only readable by a job
    # that declares the environment, and with a required reviewer that job waits for an
    # explicit approval first. So a pull request that quietly adds a step to print the
    # key gets nothing, and any attempt to use it has to be approved by a human.
    environment: release

    steps:
      # Third-party actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action's repository can repoint v4 at new code, and that code runs
      # on this runner with these secrets in scope. A SHA cannot be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Read version
        id: version
        run: |
          version=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (code ${{ github.run_number }})"

      # Written to the runner's temp directory, which is destroyed with the runner, and
      # never into the workspace where a later step could archive it by accident.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/17-releases.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Checked before the build, because a wrong key password does not surface until
      # packageRelease and then reports "Get Key failed: Tag number over 30 at 0" - the
      # ASN.1 parser choking on a badly decrypted key, with nothing in the message about
      # passwords. Three minutes of build to learn that is three minutes wasted.
      - name: Check the key opens
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                       -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore. KEYSTORE_PASSWORD or KEY_ALIAS is wrong."
            exit 1
          fi
          if ! keytool -certreq -keystore "$RUNNER_TEMP/release.jks" \
                       -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
                       -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore opens but the key does not. PKCS12 keeps store and key"
            echo "::error::under one password - set KEY_PASSWORD to the same value as"
            echo "::error::KEYSTORE_PASSWORD. See docs/17-releases.md."
            exit 1
          fi
          echo "Keystore and key both open."

      - name: Assemble release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }}

      # Explicit rather than relying on the runner being discarded: if a later step is
      # ever added, the key is already gone by the time it runs.
      - name: Shred the key
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"

      - name: Confirm it is signed
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No release APK produced"; exit 1; }
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk" \
            | grep -E 'Signer #1 certificate (DN|SHA-256)'
          mv "$apk" "kern-${{ steps.version.outputs.name }}.apk"

      # A draft: nothing is public until you press publish, and the in-app updater ignores
      # drafts and pre-releases, so an accidental push cannot ship an update to anyone.
      - name: Draft the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.name }}
          name: Kern ${{ steps.version.outputs.name }}
          files: kern-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
