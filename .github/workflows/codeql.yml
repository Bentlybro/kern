name: CodeQL

# Advisory, not a gate. This is deliberately *not* a required status check: blocking
# merges on a scanner that occasionally has opinions about generated code is the fastest
# way to end up disabling it entirely.
#
# It earns its place here for one specific reason. Kern builds shell commands as strings
# and runs them inside the guest — project names, clone URLs, commit messages, the agent
# command — and command injection is exactly what this is good at finding. Everything is
# sanitised by hand today, which is precisely the kind of thing worth a second opinion.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, so newly published rules reach existing code rather than only new commits.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      security-events: write   # to upload the results

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Kotlin only. The C in app/src/main/cpp is a 200-line PTY wrapper, and analysing it
      # would mean driving the NDK build under CodeQL — slow, fragile, and less useful
      # than reading it. Revisit if that file grows.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths-ignore:
              # Termux's terminal emulator and view, carried verbatim and deliberately
              # not modified so it stays mergeable with upstream. Findings here are
              # theirs to fix, and every one we cannot act on trains us to ignore the
              # list — which is how a scanner stops being useful.
              - app/src/main/java/com/termux

      # Built explicitly rather than by autobuild: this is an Android project with an NDK
      # step, and assembleDebug is the build we actually care about.
      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Analyse
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:java-kotlin
